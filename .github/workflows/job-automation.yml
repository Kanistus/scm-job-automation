name: Job Automation (Naukri + Indeed)

on:
  workflow_dispatch:

concurrency:
  group: scm-job-apply
  cancel-in-progress: false

jobs:
  run-automation:
    name: Run Job Automation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: 4. Setup browser & drivers
        run: |
          python -m camoufox fetch
          playwright install --with-deps firefox

      - name: 5. Load configuration & GitHub Secrets
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          NAUKRI_SESSION_JSON: ${{ secrets.NAUKRI_SESSION_JSON }}
          INDEED_SESSION_B64: ${{ secrets.INDEED_SESSION_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p backend/data/sessions
          
          # Restore Naukri session
          if [ -n "$NAUKRI_SESSION_B64" ]; then
            echo "$NAUKRI_SESSION_B64" | base64 --decode > backend/data/sessions/naukri_session.json
            echo "[+] Successfully restored Naukri session from NAUKRI_SESSION_B64."
          elif [ -n "$NAUKRI_SESSION_JSON" ]; then
            echo "$NAUKRI_SESSION_JSON" > backend/data/sessions/naukri_session.json
            echo "[+] Successfully restored Naukri session from NAUKRI_SESSION_JSON."
          else
            echo "::warning ::No NAUKRI_SESSION_B64 or NAUKRI_SESSION_JSON secret found in repository secrets."
          fi

          # Restore Indeed session if present
          if [ -n "$INDEED_SESSION_B64" ]; then
            echo "$INDEED_SESSION_B64" | base64 --decode > backend/data/sessions/indeed_session.json
            echo "[+] Successfully restored Indeed session from INDEED_SESSION_B64."
          fi

          # Initialize candidate profile and inject database settings
          PYTHONPATH=backend python backend/seed_profile.py
          PYTHONPATH=backend python -c "import os, database as db; db.init_db(); db.update_setting('telegram_enabled', 'true'); db.update_setting('telegram_bot_token', os.getenv('TELEGRAM_BOT_TOKEN', '')); db.update_setting('telegram_chat_id', os.getenv('TELEGRAM_CHAT_ID', ''))"

      - name: 6. Run Naukri + Indeed Automation
        env:
          PYTHONPATH: backend
          CI: 'true'
          CI_HEADLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/automate_apply.py

      - name: 7. Upload logs and output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-automation-output-${{ github.run_id }}
          path: |
            backend/data/app_data.db
            backend/data/report.json
          retention-days: 14
