name: Scheduled SCM Job Auto-Apply

on:
  schedule:
    # IST is UTC + 5:30
    # 08:00 AM IST -> 02:30 AM UTC
    - cron: '30 2 * * *'
    # 02:00 PM IST -> 08:30 AM UTC
    - cron: '30 8 * * *'
    # 08:00 PM IST -> 14:30 PM UTC (02:30 PM UTC)
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: scm-job-apply
  cancel-in-progress: false

jobs:
  scheduled-apply:
    name: Auto-Apply Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: 4. Setup browser & drivers
        run: |
          python -m camoufox fetch
          playwright install --with-deps firefox

      - name: 5. Load configuration & GitHub Secrets
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          NAUKRI_SESSION_JSON: ${{ secrets.NAUKRI_SESSION_JSON }}
          INDEED_SESSION_B64: ${{ secrets.INDEED_SESSION_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p backend/data/sessions
          
          # Restore Naukri session (supports base64, gzip base64, or raw JSON)
          python -c "
          import os, base64, gzip
          b64 = os.getenv('NAUKRI_SESSION_B64', '')
          raw_json = os.getenv('NAUKRI_SESSION_JSON', '')
          target = 'backend/data/sessions/naukri_session.json'
          if b64:
              try:
                  decoded = base64.b64decode(b64)
                  content = gzip.decompress(decoded) if not decoded.strip().startswith(b'{') else decoded
                  with open(target, 'wb') as f:
                      f.write(content)
                  print('[+] Successfully restored Naukri session from NAUKRI_SESSION_B64.')
              except Exception as e:
                  print(f'[!] Error decoding NAUKRI_SESSION_B64: {e}')
          elif raw_json:
              with open(target, 'w') as f:
                  f.write(raw_json)
              print('[+] Successfully restored Naukri session from NAUKRI_SESSION_JSON.')
          else:
              print('::warning ::No Naukri session secret found.')
          "

          # Restore Indeed session if present (supports base64 or gzip base64)
          python -c "
          import os, base64, gzip
          b64 = os.getenv('INDEED_SESSION_B64', '')
          target = 'backend/data/sessions/indeed_session.json'
          if b64:
              try:
                  decoded = base64.b64decode(b64)
                  content = gzip.decompress(decoded) if not decoded.strip().startswith(b'{') else decoded
                  with open(target, 'wb') as f:
                      f.write(content)
                  print('[+] Successfully restored Indeed session from INDEED_SESSION_B64.')
              except Exception as e:
                  print(f'[!] Error decoding INDEED_SESSION_B64: {e}')
          "

          # Initialize candidate profile and inject database settings with PYTHONPATH
          PYTHONPATH=backend python backend/seed_profile.py
          PYTHONPATH=backend python -c "import os, database as db; db.init_db(); db.update_setting('telegram_enabled', 'true'); db.update_setting('telegram_bot_token', os.getenv('TELEGRAM_BOT_TOKEN', '')); db.update_setting('telegram_chat_id', os.getenv('TELEGRAM_CHAT_ID', ''))"

      - name: 6. Run SCM Job Auto-Apply Sweep
        env:
          PYTHONPATH: backend
          CI: 'true'
          CI_HEADLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/automate_apply.py

      - name: 7. Upload execution database and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-apply-database-${{ github.run_id }}
          path: |
            backend/data/app_data.db
            backend/data/report.json
          retention-days: 14
