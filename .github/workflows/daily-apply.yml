name: Manual Nakuri SCM Job Automation

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m camoufox fetch

      - name: Decode and write session files
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          INDEED_SESSION_B64: ${{ secrets.INDEED_SESSION_B64 }}
        run: |
          mkdir -p backend/data/sessions
          if [ -n "$NAUKRI_SESSION_B64" ]; then
            echo "$NAUKRI_SESSION_B64" | base64 --decode > backend/data/sessions/naukri_session.json
          fi
          if [ -n "$INDEED_SESSION_B64" ]; then
            echo "$INDEED_SESSION_B64" | base64 --decode > backend/data/sessions/indeed_session.json
          fi

      - name: Run SCM Job Auto-Apply (Headless Cloud Run)
        env:
          CI_HEADLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/automate_apply.py

      - name: Upload Application Database Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-application-database
          path: |
            backend/data/app_data.db
            scheduler.log
